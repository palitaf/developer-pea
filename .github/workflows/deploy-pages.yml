name: Build Angular and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - run: npm install --no-audit --no-fund
        working-directory: client
      - name: Configure API endpoint
        working-directory: client
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            sed -i "s#http://localhost:3000/api#$API_BASE_URL#g" src/assets/app-config.js
          else
            echo "Set repository variable API_BASE_URL to your deployed API URL" >&2
            exit 1
          fi
      - run: npx ng build --configuration production --base-href "/${GITHUB_REPOSITORY#*/}/"
        working-directory: client
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist/pea-materials/browser
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
