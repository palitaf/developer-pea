  <div id="confirmOrderModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[85] flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[88vh] flex flex-col overflow-hidden">
      
      <!-- หัวป็อปอัพ -->
      <div class="p-4 bg-purple-800 text-white flex justify-between items-center shrink-0">
        <h3 class="font-bold text-base md:text-lg flex items-center gap-2">
          <i class="fa-solid fa-clipboard-check text-amber-300"></i> ตรวจสอบรายการก่อนยืนยันการส่ง
        </h3>
        <button type="button" onclick="closeConfirmOrderModal()" class="text-purple-200 hover:text-white">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- เนื้อหาภายในป็อปอัพ -->
      <div class="p-5 overflow-y-auto flex-1 space-y-4">
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs md:text-sm space-y-1">
          <div><span class="font-semibold text-slate-600">แผนก / งานที่ขอเบิก:</span> <span id="confirmDeptText" class="font-bold text-slate-800">-</span></div>
          <div><span class="font-semibold text-slate-600">ประจำรอบเดือน:</span> <span id="confirmMonthText" class="font-bold text-purple-800">-</span></div>
        </div>

        <div class="overflow-x-auto border border-slate-200 rounded-xl">
          <table class="w-full text-sm text-left border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-700 border-b">
                <th class="py-2.5 px-3 w-14 text-center">ที่</th>
                <th class="py-2.5 px-3">รายการวัสดุ</th>
                <th class="py-2.5 px-3 w-24 text-center">จำนวน</th>
                <th class="py-2.5 px-3 w-24 text-center">หน่วยนับ</th>
                <th class="py-2.5 px-3 w-24 text-center">ลบรายการ</th>
              </tr>
            </thead>
            <tbody id="confirmItemsTableBody" class="divide-y divide-slate-100 bg-white">
            </tbody>
          </table>
        </div>

        <div class="text-right text-sm font-bold text-purple-900">
          รวมทั้งหมด <span id="confirmModalItemCount">0</span> รายการ (<span id="confirmModalTotalQty">0</span> ชิ้น)
        </div>
      </div>

      <!-- ปุ่มด้านล่างป็อปอัพ -->
      <div class="p-4 bg-slate-50 border-t flex justify-end gap-2 shrink-0">
        <button type="button" onclick="closeConfirmOrderModal()" class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-semibold rounded-xl text-xs md:text-sm transition">
          กลับไปแก้ไข
        </button>
        <button type="button" id="confirmSendBtn" onclick="confirmAndSendOrder()" class="px-5 py-2 bg-purple-800 hover:bg-purple-900 text-white font-semibold rounded-xl text-xs md:text-sm transition shadow flex items-center gap-1.5">
          <i class="fa-solid fa-paper-plane"></i> ยืนยันและส่งข้อมูล
        </button>
      </div>

    </div>
  </div>
